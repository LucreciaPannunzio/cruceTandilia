    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            bg: '#fcfaf8',
                            pink: '#ffe5ec',
                            peach: '#ffe5d9',
                            green: '#d8f3dc',
                            blue: '#e0fbfc',

    <style>
        body {
            background-color: theme('colors.pastel.bg');
            color: theme('colors.pastel.text');
        }
        
        .day-checkbox {
            appearance: none;
            width: 1.5rem;
            height: 1.5rem;
            border: 2px solid theme('colors.pastel.accent');
            border-radius: 0.375rem;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease-in-out;
            background-color: white;
            flex-shrink: 0;
        }

        .day-checkbox:checked {
            background-color: white;
            border-color: #22c55e;
        }

        .day-checkbox:checked::after {
            content: '✓';
            position: absolute;
            color: #22c55e;
            font-size: 1.25rem;
            font-weight: bold;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .card-completed {
            opacity: 0.7;
            filter: grayscale(15%);
        }

        .progress-bar-fill {
            transition: width 0.5s ease-in-out;
        }
    </style>

                const weekDiv = document.createElement('div');
                weekDiv.className = 'bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden';
                
                const weekHeader = document.createElement('div');
                weekHeader.className = 'bg-gray-50 px-4 py-3 sm:px-6 sm:py-4 border-b border-gray-100 flex justify-between items-center';
                weekHeader.innerHTML = `
                    <h2 class="text-lg sm:text-xl font-semibold">Semana ${week.weekNumber}</h2>
                    <span class="text-xs sm:text-sm text-gray-500">${week.dateRange}</span>
                `;
                weekDiv.appendChild(weekHeader);

                const daysDiv = document.createElement('div');
                daysDiv.className = 'p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 gap-4';

                week.days.forEach(day => {
                    totalActiveDays++;

                    const isChecked = savedProgress[day.id] ? 'checked' : '';
                    const completedClass = isChecked ? 'card-completed' : '';
                    const currentEmoji = savedEmojis[day.id] || '';
                    
                    const dayCard = document.createElement('div');
                    dayCard.className = `flex items-start gap-3 sm:gap-4 p-4 sm:p-5 rounded-xl transition-all duration-300 ${day.bg} ${completedClass}`;
                    dayCard.id = `card-${day.id}`;
                    
                    dayCard.innerHTML = `
                        <div class="flex-shrink-0 mt-1">
                            <input type="checkbox" id="${day.id}" class="day-checkbox" ${isChecked} onchange="toggleDay('${day.id}')">
                        </div>
                        <div class="flex-1 w-full min-w-0">
                            <div class="flex items-center gap-2 mb-1 flex-wrap">
                                <label for="${day.id}" class="font-semibold text-base sm:text-lg cursor-pointer">${day.day}</label>
                                <span class="text-xs font-medium px-2 py-1 bg-white bg-opacity-50 rounded-full">${day.label}</span>
                            </div>
                            <p class="text-xs sm:text-sm cursor-pointer mb-3 leading-relaxed" onclick="document.getElementById('${day.id}').click()">${day.desc}</p>
                            
                            <div class="flex flex-wrap items-center gap-2 bg-white bg-opacity-40 p-2 sm:px-3 sm:py-2 rounded-lg w-full sm:w-max mt-2" onclick="event.stopPropagation()">
                                <span class="text-xs text-gray-600 mr-1 sm:mr-2 font-medium w-full sm:w-auto mb-1 sm:mb-0">¿Cómo te sentiste?</span>
                                
                                <div class="flex items-center gap-3">
                                    <label class="relative cursor-pointer flex items-center justify-center">
                                        <input type="radio" name="estado_${day.id}" value="bien" class="hidden peer" onchange="saveEmoji('${day.id}', 'bien')" ${currentEmoji === 'bien' ? 'checked' : ''}>
                                        <span class="block text-xl sm:text-2xl opacity-40 hover:opacity-70 peer-checked:opacity-100 peer-checked:scale-110 peer-checked:bg-pastel-green rounded-full px-1 transition-all duration-200">😃</span>
                                    </label>

                                    <label class="relative cursor-pointer flex items-center justify-center">
                                        <input type="radio" name="estado_${day.id}" value="regular" class="hidden peer" onchange="saveEmoji('${day.id}', 'regular')" ${currentEmoji === 'regular' ? 'checked' : ''}>
                                        <span class="block text-xl sm:text-2xl opacity-40 hover:opacity-70 peer-checked:opacity-100 peer-checked:scale-110 peer-checked:bg-pastel-yellow rounded-full px-1 transition-all duration-200">😐</span>
                                    </label>

                                    <label class="relative cursor-pointer flex items-center justify-center">
                                        <input type="radio" name="estado_${day.id}" value="mal" class="hidden peer" onchange="saveEmoji('${day.id}', 'mal')" ${currentEmoji === 'mal' ? 'checked' : ''}>
                                        <span class="block text-xl sm:text-2xl opacity-40 hover:opacity-70 peer-checked:opacity-100 peer-checked:scale-110 peer-checked:bg-pastel-accent rounded-full px-1 transition-all duration-200">😞</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    `;
                    daysDiv.appendChild(dayCard);
                });

                weekDiv.appendChild(daysDiv);
                container.appendChild(weekDiv);
            });

            document.getElementById('total-days').innerText = totalActiveDays;
            updateProgress();
        });

        function toggleDay(dayId) {
            const checkbox = document.getElementById(dayId);
            const card = document.getElementById(`card-${dayId}`);
            
            savedProgress[dayId] = checkbox.checked;
            localStorage.setItem('runProgress_50k_tandil', JSON.stringify(savedProgress));

            if(checkbox.checked) {
                card.classList.add('card-completed');
            } else {
                card.classList.remove('card-completed');
            }

            updateProgress();
        }

        function saveEmoji(dayId, status) {
            savedEmojis[dayId] = status;
            localStorage.setItem('runEmojis_50k_tandil', JSON.stringify(savedEmojis));
        }

        function updateProgress() {
            const completedCount = Object.values(savedProgress).filter(val => val === true).length;
            document.getElementById('days-completed').innerText = completedCount;
            
            const percentage = totalActiveDays === 0 ? 0 : Math.round((completedCount / totalActiveDays) * 100);
            
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${percentage}%`;
        }
    </script>
</body>
</html>
